name: update-signals

# Fetch Taiwan MOPS monthly revenue + Korea Customs export data + Japan MOF
# trade statistics, recompute derived signals, and commit any changes
# (git-scraping pattern).
#
# Publication calendar the daily run rides on:
#   Taiwan monthly revenue: filed by the 10th of the following month
#   Korea flash exports:    days 1-10 on the 11th, 1-20 on the 21st,
#                           full month on the 1st
#   Japan press releases:   first 10 days ~28th (08:50 JST), first 20 days
#                           ~7th of next month, monthly ~20th of next month,
#                           detailed/e-Stat CSVs ~end of next month
#   U.S. Census trade:      ~5 weeks after month end (FT-900 schedule)
# The fetchers are idempotent and no-op when nothing new is published,
# so a daily cron is safe and catches late filers and revisions.

on:
  schedule:
    - cron: "30 7 * * *"   # 15:30 Taipei / 16:30 Seoul, after publish times
    # Second attempt: tradedata.go.kr connectivity from cloud runners flaps,
    # and fetchers are idempotent, so a later retry window is free insurance.
    - cron: "30 12 * * *"
    # CFTC Commitments of Traders only: the weekly report is published Friday
    # 15:30 ET (19:30 UTC in summer, 20:30 UTC in winter). 21:30 UTC lands
    # after it in both, so the week's positioning is in the repo Friday
    # evening instead of Saturday morning. Runs the CFTC step alone.
    - cron: "30 21 * * 5"
  workflow_dispatch:
    inputs:
      taiwan_backfill:
        description: "Backfill Taiwan archive, e.g. 2024-01:2026-06 (slow, polite pauses)"
        required: false
        default: ""
      korea_monthly_range:
        description: "Korea monthly range, e.g. 2024-01:2026-07"
        required: false
        default: ""
      korea_flash_backfill:
        description: "Backfill Korea flash windows, e.g. 2016-01:2026-08 (one-time)"
        required: false
        default: ""
      korea_items_range:
        description: "Backfill Korea flash breakdowns, e.g. 201601:202609 (one call per dimension)"
        required: false
        default: ""
      capture_pages:
        description: "Set to any value to snapshot tradedata.go.kr pages into data/korea/raw/pages/"
        required: false
        default: ""
      japan_flash_backfill:
        description: "Backfill Japan press-release windows, e.g. 2021-01:2026-08 (one-time)"
        required: false
        default: ""
      japan_capture:
        description: "Set to any value to snapshot Japan sources into data/japan/raw/pages/"
        required: false
        default: ""
      japan_only:
        description: "Set to any value to skip the Taiwan, Korea and U.S. steps (keeps tradedata.go.kr's manual-run budget intact)"
        required: false
        default: ""
      fx_backfill:
        description: "Backfill reference rates, e.g. 2015-01-01:2026-09-15 (one request per year)"
        required: false
        default: ""
      us_only:
        description: "Set to any value to run only the U.S. Census steps"
        required: false
        default: ""
      us_backfill:
        description: "Backfill U.S. Census months, e.g. 2013-01:2026-07 (one-time; ~20 calls per month)"
        required: false
        default: ""
      cftc_only:
        description: "Set to any value to run only the CFTC Commitments of Traders step"
        required: false
        default: ""
      treasury_backfill:
        description: "Backfill Treasury yields from a start year, e.g. 1990 (one request per year)"
        required: false
        default: ""
      cftc_backfill:
        description: "Backfill every watched CFTC COT market from a start date, e.g. 2006-06-13 (TFF and disaggregated history begin then)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # True for a manual cftc_only run and for the Friday-evening schedule.
      CFTC_ONLY: ${{ github.event.inputs.cftc_only != '' || github.event.schedule == '30 21 * * 5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r signals/requirements.txt

      - name: Run offline tests
        run: python -m unittest discover tests

      # Sources are independent: a failure in one is a visible red step but
      # must not block fetching the others.
      - name: Fetch Taiwan monthly revenue (current month)
        if: ${{ github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.taiwan_mops current

      - name: Backfill Taiwan archive (manual runs only)
        if: ${{ github.event.inputs.taiwan_backfill != '' && github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        run: |
          RANGE="${{ github.event.inputs.taiwan_backfill }}"
          python -m signals.taiwan_mops backfill "${RANGE%%:*}" "${RANGE##*:}"

      - name: Fetch Korea tradedata.go.kr dashboard (no key required)
        if: ${{ github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.korea_tradedata dashboard

      - name: Fetch Korea tradedata.go.kr by-item flash (no key required)
        if: ${{ github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.korea_items_range }}" ]; then
            RANGE="${{ github.event.inputs.korea_items_range }}"
            python -m signals.korea_tradedata items-backfill "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.korea_tradedata items
          fi

      - name: Capture tradedata pages for parser development (manual runs only)
        if: ${{ github.event.inputs.capture_pages != '' && github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: |
          python -m signals.korea_tradedata capture
          python -m signals.korea_tradedata probe

      - name: Fetch Korea Customs data
        if: ${{ github.event.inputs.japan_only == '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.korea_flash_backfill }}" ]; then
            RANGE="${{ github.event.inputs.korea_flash_backfill }}"
            python -m signals.korea_customs flash-backfill "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.korea_customs flash
          fi
          if [ -n "${{ github.event.inputs.korea_monthly_range }}" ]; then
            RANGE="${{ github.event.inputs.korea_monthly_range }}"
            python -m signals.korea_customs monthly "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.korea_customs monthly-latest
          fi

      # Japan: static files on customs.go.jp + e-Stat CSVs, no key. Each
      # sub-source is its own step so one drifting schema is one red step.
      - name: Capture Japan sources for parser development (manual runs only)
        if: ${{ github.event.inputs.japan_capture != '' && github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.japan_customs capture

      - name: Fetch Japan press-release windows (10-day, 20-day, monthly)
        if: ${{ github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.japan_flash_backfill }}" ]; then
            RANGE="${{ github.event.inputs.japan_flash_backfill }}"
            python -m signals.japan_customs flash-backfill "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.japan_customs flash
          fi

      - name: Fetch Japan time-series CSVs
        if: ${{ github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.japan_customs timeseries

      - name: Fetch Japan e-Stat monthly HS-level CSVs
        if: ${{ github.event.inputs.us_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.japan_customs estat

      # U.S.: Census International Trade API (free key) + keyless HTS snapshot.
      - name: Snapshot HTS code descriptions (keyless)
        if: ${{ github.event.inputs.japan_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: python -m signals.us_census hts

      - name: Fetch U.S. Census monthly trade by HTS code
        if: ${{ github.event.inputs.japan_only == '' && env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.us_backfill }}" ]; then
            RANGE="${{ github.event.inputs.us_backfill }}"
            python -m signals.us_census backfill "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.us_census monthly
          fi

      # Reference exchange rates (keyless, ECB with a fallback). Needed before
      # the recompute so the yen series can be restated in USD and a currency
      # move told apart from a real one. Runs on every dispatch, including
      # japan_only and us_only, because it is a single request.
      - name: Fetch daily reference exchange rates (keyless)
        if: ${{ env.CFTC_ONLY != 'true' }}
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.fx_backfill }}" ]; then
            RANGE="${{ github.event.inputs.fx_backfill }}"
            python -m signals.fx_rates backfill "${RANGE%%:*}" "${RANGE##*:}"
          else
            python -m signals.fx_rates daily
          fi

      # CFTC Commitments of Traders (keyless Socrata API). Weekly: positions as
      # of Tuesday, published Friday 15:30 ET, so the daily run no-ops on most
      # days. Pulls every market in the "watch" section of
      # signals/config/cftc_endpoints.json (TFF for equity indices and the
      # dollar, disaggregated for gold and crude), then rebuilds the weekly
      # net-change table data/derived/cftc_flows.csv.
      - name: Fetch CFTC Commitments of Traders (keyless)
        continue-on-error: true
        env:
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.cftc_backfill }}" ]; then
            python -m signals.cftc_cot backfill "${{ github.event.inputs.cftc_backfill }}"
          else
            python -m signals.cftc_cot latest
          fi
          python -m signals.cftc_cot flows
          python -m signals.cftc_cot brief

      # Daily prices for SPY, QQQ, UUP, GLD, USO and GLD's gold holdings
      # (keyless), for testing whether CFTC positioning shifts come before
      # moves and flows in those funds (signals/cftc_leadlag.py).
      - name: Fetch fund prices and GLD holdings (keyless)
        continue-on-error: true
        run: python -m signals.etf_prices fetch

      # U.S. Treasury daily par yield curve (keyless): 2-year, 10-year and the
      # gaps between them, for the macro dashboard's rates panel.
      - name: Fetch Treasury yields (keyless)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -n "${{ github.event.inputs.treasury_backfill }}" ]; then
            python -m signals.treasury_yields backfill "${{ github.event.inputs.treasury_backfill }}"
          else
            python -m signals.treasury_yields latest
          fi

      - name: Snapshot the previous derived tables (baseline for the diff)
        run: |
          rm -rf "$RUNNER_TEMP/derived_prev"
          mkdir -p "$RUNNER_TEMP/derived_prev"
          cp data/derived/*.csv "$RUNNER_TEMP/derived_prev/" 2>/dev/null || true

      - name: Recompute derived signals
        run: python -m signals.compute_signals

      # The weekly macro dashboard's numbers and page, from the tables above.
      - name: Build the macro dashboard
        continue-on-error: true
        run: python -m signals.macro_dashboard

      # What changed this run: new prints, revisions and threshold flags.
      # Written to data/derived/whats_new.md, to the run's job summary (the
      # Actions run page), and into the commit subject. The daily intelligence
      # brief (a Claude Routine) reads whats_new.md to write the What / So what
      # / What now sections.
      - name: Diff against the previous run and flag watch items
        id: intel
        run: |
          python -m signals.intel --previous "$RUNNER_TEMP/derived_prev" | tee "$RUNNER_TEMP/intel.out"
          echo "subject=$(tail -n 1 "$RUNNER_TEMP/intel.out")" >> "$GITHUB_OUTPUT"

      - name: Commit and push if data changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "signals: data update $(date -u +%F): ${{ steps.intel.outputs.subject }}"
          for delay in 2 4 8 16 0; do
            git push && exit 0
            [ "$delay" = "0" ] && exit 1
            sleep "$delay"
            git pull --rebase --no-autostash || true
          done
