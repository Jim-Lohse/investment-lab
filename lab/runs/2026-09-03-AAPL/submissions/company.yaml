reverse_dcf:
  implied_assumptions: >
    At $324.96 (~$4.74T, 42.4x FY25 EPS, 36.9x FY26E, ~2.1% trailing FCF yield):
    to earn ~9-10%/yr, either (a) FCF grows ~7-9%/yr for a decade with ~4%/yr share
    shrink AND the terminal multiple holds at ~28-30x+, or (b) if the multiple
    mean-reverts toward ~20x FCF, FCF must compound ~14-15%/yr for 10 years
    ($99B → ~$390B). Branch (b) has no precedent from a $400B-revenue base.
    Branch (a) requires Apple to hold a premium multiple it has itself traded
    below (12-30x range) for most of the last decade, through a CEO transition,
    while consensus for the first post-cycle year is being cut.
  reference_class_verdict: top-decile  # branch (a); branch (b) is never-achieved
