core_claim: >
  Apple's economic claim is a mature quality-compounding engine — an installed-base
  ecosystem (~2.4B active devices per management, all-time high per Q3 FY26 release)
  that monetizes through premium hardware refresh plus attached Services, now with a
  claimed second act: an AI-driven upgrade cycle ("all-new Siri AI," WWDC26) that
  restored double-digit growth in FY2026 (Q3 revenue $109.4B, +16% YoY, records in
  iPhone/Mac/Services per the 8-K exhibit). The engine's cash translation is real and
  primary-sourced: FY25 GM 46.9%, FCF margin 23.7%, share count -4%/yr, EPS CAGR 14%
  over 8 years on only 6.6% revenue CAGR. The open question is not whether the engine
  exists but whether the AI leg is durable: Q3's headline strength included ~2pp of
  gross margin and $0.11 of EPS from one-time tariff refunds (disclosed in the release),
  the stock fell 9.3% on the print anyway, FY27 revisions are rolling over (8 up/19
  down, avg $9.71→$9.53), reinvestment intensity is inflecting (FY25 capex +35%, Q3
  R&D +32% YoY, intangibles $11.1B→$20.3B in nine months), and a CEO transition
  (Ternus, Form 4 dated 2026-09-01) landed the month the fiscal year closes. At
  ~$4.74T / ~37x FY26E, the price pays for the durable-AI-supercycle version of the
  claim, not the mature-compounder version the filed record supports.
engine: quality-compounder
